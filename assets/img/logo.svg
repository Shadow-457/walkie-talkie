<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Walkie-Talkie">
  <title>Walkie-Talkie</title>
  <!-- Handset body (flat, sharp) -->
  <rect x="9" y="8" width="13" height="22" fill="none" stroke="#3e7a5c" stroke-width="2"/>
  <!-- Antenna -->
  <rect x="14" y="2" width="2.5" height="6" fill="none" stroke="#3e7a5c" stroke-width="2"/>
  <!-- Screen -->
  <rect x="11.5" y="10.5" width="8" height="2.5" fill="#3e7a5c"/>
  <!-- Speaker grille -->
  <rect x="11.5" y="15" width="8" height="1.2" fill="#3e7a5c"/>
  <rect x="11.5" y="17.2" width="8" height="1.2" fill="#3e7a5c"/>
  <rect x="11.5" y="19.4" width="8" height="1.2" fill="#3e7a5c"/>
  <!-- Push-to-talk bar -->
  <rect x="11.5" y="22.5" width="8" height="2.5" fill="#3e7a5c"/>
</svg>
